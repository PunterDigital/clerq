# One-command self-host: docker compose up
#
# Pulls the published image and runs it against a bundled Postgres. The app
# applies its own database migrations on startup, so there is no separate
# migration step to run.
#
# Defaults work out of the box for a local instance. Override the password
# (and anything else) with a .env file next to this compose file - see
# .env.example. Change POSTGRES_PASSWORD before exposing this to a network.
#
# To build from source instead of pulling the image (contributors, local
# changes), add the build override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clerq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clerq}
      POSTGRES_DB: ${POSTGRES_DB:-clerq}
    ports:
      # Bound to loopback only: reachable for local development
      # (pnpm dev against compose postgres), never from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clerq} -d ${POSTGRES_DB:-clerq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Pinnable: set CLERQ_TAG to a released version (e.g. 0.1.0) to pin, or
    # leave it for the latest stable release.
    image: ghcr.io/punterdigital/clerq:${CLERQ_TAG:-latest}
    ports:
      # Loopback by default, like Postgres above: put a TLS reverse proxy in
      # front, or set APP_BIND=0.0.0.0 to serve other machines directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clerq}:${POSTGRES_PASSWORD:-clerq}@postgres:5432/${POSTGRES_DB:-clerq}
      # Change this before exposing the instance anywhere - see .env.example
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-clerq-dev-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
