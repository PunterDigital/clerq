# The gate, in the exact order CONTRIBUTING.md defines it. Every step must pass;
# nothing here may be weakened to get a green run.
#
# GitHub-hosted runners only: this repo is public, so a self-hosted runner
# would run code from any fork's pull request on that machine.
name: CI

on:
  pull_request:
  # Post-merge safety net: also run on main directly, since the merge commit
  # can differ from the PR head. Feature branches only run via pull_request,
  # so this doesn't reintroduce the per-branch duplicate runs.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Billing fixture suite
        run: pnpm test:billing

      - name: Production build
        run: pnpm build

  # The seed is onboarding: if it breaks, the demo and every first-run
  # instance break with it, so CI proves it works
  # against a real Postgres - twice, because it must also be idempotent.
  seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clerq
          POSTGRES_PASSWORD: clerq
          POSTGRES_DB: clerq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clerq -d clerq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clerq:clerq@localhost:5432/clerq
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Seed is idempotent
        run: pnpm db:seed

      - name: Invoice numbering is concurrency-safe
        run: pnpm exec tsx scripts/check-numbering-concurrency.ts

  # Browser smoke test of the production build against a seeded Postgres:
  # sign in as the demo user and walk the core flow (see e2e/).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clerq
          POSTGRES_PASSWORD: clerq
          POSTGRES_DB: clerq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clerq -d clerq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clerq:clerq@localhost:5432/clerq
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Production build
        run: pnpm build

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
