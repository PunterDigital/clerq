# Build and publish the Clerq image on version tags.
#
# Tag a green commit on main with a vX.Y.Z tag (e.g. `git tag v0.1.0 && git
# push origin v0.1.0`) and this builds a linux/amd64 image and pushes it to the
# GitHub Container Registry. Self-hosters pull ghcr.io/punterdigital/clerq.
#
# `latest` tracks the newest stable release only - pre-release tags
# (v1.2.3-rc1) publish their own tag but never move `latest`.
#
# Then it redeploys app.useclerq.net (the DEPLOY_WEBHOOK_URL secret) and waits
# for its /version to report the new tag, creates the GitHub Release (notes
# generated from the merged PRs) and checks the image tag can be pulled
# anonymously. GitHub-hosted runners only: the repo is public.
#
# One-time setup: after the first successful run, set the package visibility to
# Public under the repo's Packages settings so anonymous pulls work.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/punterdigital/clerq
          # latest=auto: applied to stable releases, skipped for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a running instance knows its own version
          # (see the Dockerfile's CLERQ_VERSION arg) - the same "1.3.1" string
          # meta resolved from the pushed tag, reused rather than re-parsed.
          build-args: |
            CLERQ_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploy the managed cloud (app.useclerq.net) onto the image just pushed.
  # Stable releases only: a pre-release never moves `latest`, so there is
  # nothing new for it to pull.
  deploy:
    needs: image
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.useclerq.net
    steps:
      - name: Trigger the deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL is not set"; exit 1
          fi
          # -f fails the job on an HTTP error; curl's error message never
          # includes the URL, and Actions masks the secret anyway.
          curl -fsS --retry 3 --retry-all-errors --max-time 60 -X POST "$DEPLOY_WEBHOOK_URL" -o /dev/null
          echo "Deploy triggered"

      # The deploy runs asynchronously on the host: wait until the live site
      # reports the version just released (app/version/route.ts).
      - name: Live site runs the new version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 10 https://app.useclerq.net/version | jq -r .version || true)
            [ "$got" = "$want" ] && { echo "app.useclerq.net is on $want"; exit 0; }
            echo "app.useclerq.net reports ${got:-nothing}, waiting for $want"
            sleep 15
          done
          echo "app.useclerq.net did not report $want within 15 minutes"; exit 1

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the GitHub Release
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
              --generate-notes --verify-tag $prerelease
          fi

      - name: Image is pullable anonymously
        run: |
          version="${TAG#v}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:punterdigital/clerq:pull" | jq -r .token)
          curl -fsSI -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/punterdigital/clerq/manifests/$version" \
            || { echo "ghcr.io/punterdigital/clerq:$version not found"; exit 1; }
