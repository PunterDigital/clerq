version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # better-auth 1.7 moves MCP auth out of core (/mcp/* -> /oauth2/*).
      # Held at 1.6 until that migration lands as its own change.
      - dependency-name: better-auth
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
